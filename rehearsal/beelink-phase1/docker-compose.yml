services:
  tidb:
    image: pingcap/tidb:v8.5.0
    command:
      - --store=unistore
      - --path=/tmp/tidb
      - --host=0.0.0.0
      - --advertise-address=127.0.0.1
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:10080:10080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - tidb_rehearsal_data:/tmp/tidb
    restart: "no"

volumes:
  tidb_rehearsal_data:
    name: ojala_phase1_rehearsal_data
